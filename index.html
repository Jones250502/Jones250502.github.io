<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="">
  <title></title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
  <header class="site-header">
    <nav class="navbar" aria-label="" data-i18n-attr="aria-label:nav.label">
      <a class="brand" href="#home" aria-label="" data-i18n-attr="aria-label:brand.homeLabel">
        <span class="brand-mark" data-i18n="brand.mark"></span>
        <span class="brand-text" data-i18n="brand.text"></span>
      </a>

      <ul class="nav-links" data-nav-list></ul>

      <div class="nav-controls">
        <button class="language-toggle" type="button" data-language-toggle aria-label="" data-i18n-attr="aria-label:language.label">
          <span class="language-option" data-lang-option="de">DE</span>
          <span class="language-divider" aria-hidden="true">|</span>
          <span class="language-option" data-lang-option="en">EN</span>
        </button>
        <button class="nav-toggle" type="button" aria-label="" aria-expanded="false" data-i18n-attr="aria-label:nav.menuLabel">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
    </nav>
  </header>

  <main>
    <section class="hero" id="home">
      <div class="hero-bg" aria-hidden="true"></div>
      <div class="hero-overlay" aria-hidden="true"></div>
      <div class="hero-lines" aria-hidden="true"></div>

      <div class="hero-inner">
        <div class="hero-content reveal">
          <p class="hero-kicker" data-i18n="hero.kicker"></p>
          <h1 data-i18n="hero.name"></h1>
          <p class="hero-degree" data-i18n="hero.degree"></p>
          <p class="hero-focus" data-i18n="hero.focus"></p>

          <div class="hero-actions" aria-label="" data-hero-actions data-i18n-attr="aria-label:hero.actionsLabel"></div>
        </div>
      </div>
    </section>

    <section class="section about section-split" id="about">
      <div class="section-heading reveal">
        <p class="eyebrow" data-i18n="about.eyebrow"></p>
        <h2 data-i18n="about.heading"></h2>
      </div>
      <div class="about-grid">
        <article class="about-card about-card-main reveal">
          <h3 data-i18n="about.cardTitle"></h3>
          <div data-about-text></div>
        </article>
        <aside class="toolbox-card reveal" aria-label="" data-i18n-attr="aria-label:toolbox.label">
          <div class="toolbox-header">
            <p data-i18n="toolbox.subtitle"></p>
            <h3 data-i18n="toolbox.title"></h3>
          </div>
          <div class="toolbox-grid" data-toolbox-grid></div>
        </aside>
      </div>
    </section>

    <section class="section skills-band is-hidden" aria-label="" data-i18n-attr="aria-label:skills.label">
      <div class="skills-track reveal" data-skills-list></div>
    </section>

    <section class="section journey" id="journey">
      <div class="section-heading reveal">
        <p class="eyebrow" data-i18n="journey.eyebrow"></p>
        <h2 data-i18n="journey.heading"></h2>
      </div>

      <div class="journey-track" data-journey-list></div>
    </section>

    <section class="section projects" id="projects">
      <div class="section-heading reveal">
        <p class="eyebrow" data-i18n="projects.eyebrow"></p>
        <h2 data-i18n="projects.heading"></h2>
      </div>

      <div class="project-grid" data-project-list></div>
    </section>

    <section class="section cv-section" id="cv">
      <div class="section-heading reveal">
        <p class="eyebrow" data-i18n="cv.kicker"></p>
        <h2 data-i18n="cv.title"></h2>
        <p data-i18n="cv.subtitle"></p>
      </div>

      <div class="cv-card reveal">
        <div class="cv-highlights" data-cv-highlights></div>
        <div class="cv-actions" data-cv-actions></div>
      </div>
    </section>

    <section class="section contact" id="contact">
      <div class="section-heading reveal">
        <p class="eyebrow" data-i18n="contact.eyebrow"></p>
        <h2 data-i18n="contact.heading"></h2>
      </div>
      <div class="contact-grid" data-contact-list></div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-actions" data-footer-actions></div>
      <p class="footer-copyright" data-footer-copyright></p>
    </div>
  </footer>

  <script src="content.js?v=2"></script>
  <script src="script.js?v=4"></script>
</body>
</html>
